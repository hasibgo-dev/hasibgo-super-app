workflows:
  default-workflow:
    name: default workflow
    environment:
      flutter: stable
      xcode: latest
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: clean project
        script: |
          flutter clean
          flutter pub get
      - name: build android app bundle
        script: |
          flutter build appbundle --release
      - name: build ios ipa
        script: |
          flutter build ipa --release --export-options-plist=exportoptions.plist
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/ios/ipa/*.ipa
